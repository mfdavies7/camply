name: test

# Disabled for now: runs only when started by hand. Original triggers:
#     push:
#         branches:
#             - main
#         paths:
#             - spotsnagger/**
#             - pyproject.toml
#             - uv.lock
#             - .github/workflows/test.yaml
#     pull_request:
#         paths:
#             - spotsnagger/**
#             - pyproject.toml
#             - uv.lock
#             - .github/workflows/test.yaml
#     schedule:
#         - cron: 0 12 1 * *
on:
    workflow_dispatch:
jobs:
    test:
        env:
            SPOTSNAGGER_LOG_HANDLER: PYTHON
        runs-on: ubuntu-latest
        strategy:
            fail-fast: true
            matrix:
                include:
                    - { name: Python 3.14, python: "3.14" }
                    - { name: Python 3.13, python: "3.13" }
                    - { name: Python 3.12, python: "3.12" }
                    - { name: Python 3.11, python: "3.11" }
                    - { name: Python 3.10, python: "3.10" }
                    - { name: Python 3.9, python: "3.9" }
        permissions:
            contents: read
            id-token: write
            pull-requests: write
        steps:
            - name: checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - name: setup-uv
              uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
            - name: setup-task
              uses: arduino/setup-task@v2
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
            - name: test
              run: task install && task test
              env:
                  UV_PYTHON: ${{ matrix.python }}
