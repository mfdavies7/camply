name: release
# Disabled for now: runs only when started by hand. Original triggers:
#     push:
#         branches: [main, next, beta, alpha, "*.x"]
on:
    workflow_dispatch:
jobs:
    release:
        name: release
        if: github.repository_owner == 'mfdavies7'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
        steps:
            - name: checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  persist-credentials: false
            - name: setup-uv
              uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
            - name: setup-node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
            - name: Semantic Release
              # commit-analyzer, release-notes-generator and github ship with semantic-release
              run: npx --yes -p semantic-release -p @semantic-release/exec -p @semantic-release/git semantic-release
              env:
                  GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

    docs:
        name: docs
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - name: setup-uv
              uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
            - name: setup-task
              uses: arduino/setup-task@v2
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
            - name: build-docs
              run: task install && task docs -- build
            - name: upload-docs
              uses: actions/upload-pages-artifact@v3
              with:
                  path: site
            - name: Publish Docs
              uses: actions/deploy-pages@v4
              id: deployment
