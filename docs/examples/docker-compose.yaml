version: "3.7"
services:
    spotsnagger:
        container_name: spotsnagger-docker-compose-example
        image: spotsnagger:latest
        environment:
            TZ: America/Denver
        volumes:
            - ${PWD}/example.spotsnagger:/home/spotsnagger/.spotsnagger
            - ${PWD}/example_search.yaml:/home/spotsnagger/search.yaml
        command: spotsnagger campsites --yaml-config /home/spotsnagger/search.yaml
        restart: unless-stopped
